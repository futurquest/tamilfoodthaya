<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamil Food Thaya</title>
    <meta
      name="description"
      content="Tamil Food Thaya - Authentic Tamil and Sri Lankan food, catering, and event services in the Netherlands."
    />
    <meta property="og:title" content="Tamil Food Thaya" />
    <meta
      property="og:description"
      content="Authentic Tamil and Sri Lankan food, catering, and event services in the Netherlands."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preload" as="image" href="/hero-catering.jpg" fetchpriority="high" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fbf6ed;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        gap: 1rem;
        padding: 2rem 1rem;
        background: radial-gradient(circle at 50% 38%, rgba(138, 46, 29, 0.12), transparent 16rem), #fbf6ed;
      }
      #app-splash__ring {
        position: relative;
        width: 5rem;
        height: 5rem;
        display: grid;
        place-items: center;
        box-sizing: border-box;
      }
      #app-splash__ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 3px solid rgba(138, 46, 29, 0.16);
        border-top-color: #8a2e1d;
        border-radius: 999px;
        animation: page-loader-spin 0.9s linear infinite;
      }
      #app-splash__ring img {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.95rem;
        object-fit: cover;
        box-shadow: 0 10px 26px rgba(138, 46, 29, 0.18);
      }
      .page-loader__brand {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        font-size: 1.05rem;
        font-weight: 800;
        font-style: normal;
        line-height: 1.25;
        letter-spacing: 0.02em;
        text-wrap: pretty;
        color: #251917;
      }
      @keyframes page-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html[data-theme='dark'] body {
        background: #181116;
      }
      html[data-theme='dark'] #app-splash {
        background: radial-gradient(circle at 50% 38%, rgba(217, 88, 59, 0.12), transparent 16rem), #181116;
      }
      html[data-theme='dark'] #app-splash__ring::before {
        border-color: rgba(217, 88, 59, 0.16);
        border-top-color: #d9583b;
      }
      html[data-theme='dark'] #app-splash__ring img {
        box-shadow: 0 10px 26px rgba(217, 88, 59, 0.18);
      }
      html[data-theme='dark'] .page-loader__brand {
        color: #fbf6ed;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash__ring::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Loading Tamil Food Thaya">
      <div id="app-splash__ring">
        <img src="/logo-reduce.png" alt="" width="56" height="56" />
      </div>
      <p class="page-loader__brand">Tamil Food Thaya</p>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('app-splash');
        var observer = new MutationObserver(function () {
          if (root.children.length && !root.querySelector('.page-loader')) {
            splash.remove();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
